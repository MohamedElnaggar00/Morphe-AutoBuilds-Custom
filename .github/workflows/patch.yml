name: Auto Build and Release Morphe

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "Rebuild every app (ignore incremental check)"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 9 * * *'
      timezone: "Africa/Cairo"  # Daily at 9:17 AM Egypt time

jobs:
  download-tools:
    name: Download Morphe Tools
    runs-on: ubuntu-latest
    if: ${{ false }}
    outputs:
      cache-key: ${{ steps.cache-key.outputs.cache-key }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      
      - name: Download Morphe Tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools
          curl -L "https://github.com/revanced/revanced-cli/releases/latest/download/revanced-cli-all.jar" -o tools/revanced-cli.jar
          curl -L "https://github.com/revanced/revanced-patches/releases/latest/download/patches.jar" -o tools/patches.jar
          curl -L "https://github.com/revanced/revanced-integrations/releases/latest/download/app-release-unsigned.apk" -o tools/integrations.apk
      
      - name: Cache Tools
        uses: actions/cache@v4
        id: cache-tools
        with:
          path: tools/
          key: revanced-tools-${{ hashFiles('patch-config.json', 'arch-config.json') }}
      
      - name: Generate Cache Key
        id: cache-key
        run: echo "cache-key=${{ steps.cache-tools.outputs.cache-key || 'no-cache' }}" >> $GITHUB_OUTPUT

  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      build_matrix: ${{ steps.check.outputs.build_matrix }}
      update_count: ${{ steps.check.outputs.update_count }}
      total_count: ${{ steps.check.outputs.total_count }}
      carry_count: ${{ steps.check.outputs.carry_count }}
      incremental: ${{ steps.check.outputs.incremental }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize Configuration
        run: python scripts/sync_config.py

      - name: Validate GitHub Auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_github_auth.py

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Validate Release Planner Syntax
        run: |
          python -m py_compile scripts/check_release_updates.py scripts/check_app_updates.py

      - name: Run Version Selection Regression Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Incremental Update Check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild || 'false' }}
        run: |
          python scripts/check_release_updates.py

      - name: Show Plan Summary
        run: |
          echo "Total entries:   ${{ steps.check.outputs.total_count }}"
          echo "Need rebuild:    ${{ steps.check.outputs.update_count }}"
          echo "Carry over:      ${{ steps.check.outputs.carry_count }}"
          echo "Incremental:     ${{ steps.check.outputs.incremental }}"

      - name: Upload Plan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: |
            build_matrix.json
            release_plan.json
          if-no-files-found: warn
          retention-days: 1

  patch-apps:
    name: Read Configuration
    needs: check-updates
    runs-on: ubuntu-latest
    if: needs.check-updates.outputs.has_updates == 'true'
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Build Matrix from Check
        id: read-matrix
        run: |
          MATRIX='${{ needs.check-updates.outputs.build_matrix }}'
          if [ -z "$MATRIX" ] || [ "$MATRIX" = "null" ]; then
            echo "Empty matrix from check; falling back to full patch-config.json"
            MATRIX=$(jq -c '.patch_list' patch-config.json)
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX" | head -c 1000

  update-readme:
    name: Update README
    needs: check-updates
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize Configuration
        run: python scripts/sync_config.py

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          pip install requests curl-cffi PyGithub

      - name: Refresh README from patch sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_readme.py

      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh README app and patch list"
          git push

  build-apps:
    name: Build Applications
    needs: patch-apps
    runs-on: ubuntu-latest
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        env:
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        options: --shm-size=1gb
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.patch-apps.outputs.matrix) }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Synchronize Configuration
        run: python scripts/sync_config.py

      - name: Restore Cached Tools
        uses: actions/cache@v4
        with:
          path: tools/
          key: revanced-tools-${{ hashFiles('patch-config.json', 'arch-config.json') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Signing Keystore
        env:
          MORPHE_KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
          MORPHE_KEY_PASSWORD: Morphe
        run: |
          set -euo pipefail

          if [ -z "${MORPHE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing GitHub Actions secret MORPHE_KEYSTORE_BASE64"
            echo "Add the base64-encoded BKS keystore in Settings > Secrets and variables > Actions."
            exit 1
          fi

          # The supplied signing key is BKS. The original Morphe-AutoBuilds
          # workflow signs with a JKS file, so convert the same key material
          # to JKS at runtime instead of committing the private key.
          sudo apt-get update
          sudo apt-get install -y libbcprov-java

          SOURCE_KEYSTORE="${RUNNER_TEMP}/morphe-signing.bks"
          SIGNING_KEYSTORE_PATH="${RUNNER_TEMP}/morphe-signing.jks"

          printf "%s" "${MORPHE_KEYSTORE_BASE64}" | base64 --decode > "${SOURCE_KEYSTORE}"
          chmod 600 "${SOURCE_KEYSTORE}"

          if [ ! -s "${SOURCE_KEYSTORE}" ]; then
            echo "::error::Decoded signing keystore is empty."
            exit 1
          fi

          keytool -importkeystore \
            -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider \
            -providerpath /usr/share/java/bcprov.jar \
            -srckeystore "${SOURCE_KEYSTORE}" \
            -srcstoretype BKS \
            -srcstorepass "" \
            -srckeypass "${MORPHE_KEY_PASSWORD}" \
            -srcalias Morphe \
            -destkeystore "${SIGNING_KEYSTORE_PATH}" \
            -deststoretype JKS \
            -deststorepass public \
            -destkeypass public \
            -destalias public \
            -noprompt

          chmod 600 "${SIGNING_KEYSTORE_PATH}"
          rm -f "${SOURCE_KEYSTORE}"

          if [ ! -s "${SIGNING_KEYSTORE_PATH}" ]; then
            echo "::error::JKS signing keystore conversion failed."
            exit 1
          fi

      - name: Build APK
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          TRAWL_URL: http://localhost:8191
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/morphe-signing.jks
          SIGNING_KEYSTORE_TYPE: JKS
          SIGNING_KEY_ALIAS: public
          SIGNING_KEYSTORE_PASSWORD: public
          SIGNING_KEY_PASSWORD: public
        run: |
          echo "Building ${{ matrix.app_name }} with ${{ matrix.source }}..."
          sleep $((RANDOM % 30)).$((RANDOM % 100))

          python -m src

          # An APK that is already published in some release is a normal skip,
          # not a failed build. Only a real build with no output should fail.
          apk_count=$(find . -maxdepth 1 -type f -name "*.apk" | wc -l)
          echo "Produced APKs: $apk_count"
          if [ "$apk_count" -eq 0 ]; then
            if [ -f .build-skipped ]; then
              echo "⏭️ Build skipped: APK is already published in an existing release."
              exit 0
            fi
            echo "::error::Build completed without producing an APK."
            exit 1
          fi

      - name: Cleanup Signing Keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/morphe-signing.bks" "${RUNNER_TEMP}/morphe-signing.jks"

      - name: Record Build Outputs
        if: always()
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p build_records
          # Record every produced APK so manifest can map (app, source, arch) -> filename
          for apk in *.apk; do
            [ -e "$apk" ] || continue
            # record_build.py now detects arch from filename automatically
            APK_PATH="$apk" python scripts/record_build.py || true
          done
          echo "Records produced:"
          ls -la build_records/ 2>/dev/null || echo "(no records)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app_name }}-${{ matrix.source }}
          path: "*.apk"

      - name: Upload Build Records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-records-${{ matrix.app_name }}-${{ matrix.source }}
          path: build_records/
          if-no-files-found: ignore

  create-app-releases:
    name: Publish Independent App Releases
    needs: [check-updates, build-apps]
    runs-on: ubuntu-latest
    if: always() && needs.check-updates.outputs.has_updates == 'true'
    permissions:
      contents: write

    steps:
      - name: Download Built APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-apks
          pattern: apk-*
          merge-multiple: false

      - name: Download Build Records
        uses: actions/download-artifact@v4
        with:
          path: ./all-records
          pattern: build-records-*
          merge-multiple: false

      - name: Collect Built APKs
        run: |
          set -euo pipefail
          mkdir -p ./release-apks
          find ./all-apks -type f -name "*.apk" -exec cp -f {} ./release-apks/ \;

          count=$(find ./release-apks -maxdepth 1 -type f -name "*.apk" | wc -l)
          echo "Built APKs ready for independent releases: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No APKs were produced by the build jobs."
            exit 1
          fi
          ls -lh ./release-apks

      - name: Publish One Release Per App and Patch Source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          published=0

          while IFS= read -r record; do

            filename="$(jq -r '.apk // empty' "$record")"
            app_name="$(jq -r '.app_name // empty' "$record")"
            source_name="$(jq -r '.source // empty' "$record")"
            arch="$(jq -r '.arch // empty' "$record")"

            if [ -z "$filename" ] || [ -z "$app_name" ] || [ -z "$source_name" ] || [ -z "$arch" ]; then
              echo "::error::Incomplete build record: $record"
              exit 1
            fi

            apk="./release-apks/$filename"
            if [ ! -f "$apk" ]; then
              echo "::error::APK referenced by $record was not found: $filename"
              exit 1
            fi

            patch_version="$(printf '%s\n' "$filename" | sed -nE 's/.*-patch-v(.+)-app-v(.+)\.apk$/\1/p')"
            app_version="$(printf '%s\n' "$filename" | sed -nE 's/.*-patch-v(.+)-app-v(.+)\.apk$/\2/p')"

            if [ -z "$patch_version" ] || [ -z "$app_version" ]; then
              echo "::error::Could not extract patch/app versions from $filename"
              exit 1
            fi

            title="${app_name} v${app_version} — Patch v${patch_version} — ${source_name} — ${arch}"

            safe_app="$(printf '%s' "$app_name" | tr -cs 'A-Za-z0-9._-' '-')"
            safe_patch="$(printf '%s' "$patch_version" | tr -cs 'A-Za-z0-9._-' '-')"
            safe_app_version="$(printf '%s' "$app_version" | tr -cs 'A-Za-z0-9._-' '-')"
            safe_source="$(printf '%s' "$source_name" | tr -cs 'A-Za-z0-9._-' '-')"
            tag="build-${safe_app}-v${safe_app_version}-patch-v${safe_patch}-${safe_source}-${GITHUB_RUN_NUMBER}"

            notes_file="${RUNNER_TEMP}/${tag}.md"
            {
              echo "- **Application:** ${app_name}"
              echo "- **Application version:** ${app_version}"
              echo "- **Patch source:** ${source_name}"
              echo "- **Patch version:** ${patch_version}"
              echo "- **Architecture:** ${arch}"
              echo "- **APK:** ${filename}"
              echo
              echo "This release contains only this app/source build."
            } > "$notes_file"

            if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release upload "$tag" "$apk" --clobber --repo "$GH_REPO"
              gh release edit "$tag" --repo "$GH_REPO" --title "$title" --notes-file "$notes_file"
            else
              gh release create "$tag" "$apk" \
                --repo "$GH_REPO" \
                --title "$title" \
                --notes-file "$notes_file" \
                --target "$GITHUB_SHA"
            fi

            if gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[].name' | grep -Fxq "$filename"; then
              echo "Published and verified: $filename"
              published=$((published + 1))
            else
              echo "::error::Release $tag was created but $filename is missing."
              exit 1
            fi
          done < <(find ./all-records -type f -name "*.json" -print)

          echo "Independent releases published: $published"

      - name: Show Published Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --repo "$GH_REPO" --limit 30

  cleanup:
    name: Cleanup Workflow Runs
    needs: [build-apps, create-app-releases]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 5
