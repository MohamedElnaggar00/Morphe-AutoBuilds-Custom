name: Pre-Final Provider Fallback Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_config.py"

jobs:
  prepare-matrix:
    name: Prepare Full Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Synchronize Configuration
        run: python scripts/sync_config.py

      - name: Build Full Matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          matrix="$(python - <<'PY'
          import json

          with open("patch-config.json", encoding="utf-8") as f:
              patch_list = json.load(f)["patch_list"]

          with open("arch-config.json", encoding="utf-8") as f:
              arch_config = json.load(f)

          rows = []
          for item in patch_list:
              matches = [
                  entry for entry in arch_config
                  if entry.get("app_name") == item["app_name"]
                  and entry.get("source") == item["source"]
              ]

              if matches:
                  for arch in matches[0].get("arches", ["universal"]):
                      rows.append({
                          "app_name": item["app_name"],
                          "source": item["source"],
                          "arch": arch,
                      })
              else:
                  rows.append({
                      "app_name": item["app_name"],
                      "source": item["source"],
                      "arch": "universal",
                  })

          print(json.dumps(rows, separators=(",", ":")))
          PY
          )"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Full build matrix:"
          echo "$matrix" | jq .

  build-all:
    name: Build ${{ matrix.app_name }} / ${{ matrix.source }} / ${{ matrix.arch }}
    needs: prepare-matrix
    runs-on: ubuntu-latest
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        env:
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        options: --shm-size=1gb

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Signing Keystore
        env:
          MORPHE_KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
          MORPHE_KEY_PASSWORD: Morphe
        run: |
          set -euo pipefail

          if [ -z "${MORPHE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing GitHub Actions secret MORPHE_KEYSTORE_BASE64"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y libbcprov-java

          SOURCE_KEYSTORE="${RUNNER_TEMP}/morphe-signing.bks"
          SIGNING_KEYSTORE_PATH="${RUNNER_TEMP}/morphe-signing.jks"

          printf "%s" "${MORPHE_KEYSTORE_BASE64}" | base64 --decode > "${SOURCE_KEYSTORE}"
          chmod 600 "${SOURCE_KEYSTORE}"

          keytool -importkeystore \
            -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider \
            -providerpath /usr/share/java/bcprov.jar \
            -srckeystore "${SOURCE_KEYSTORE}" \
            -srcstoretype BKS \
            -srcstorepass "" \
            -srckeypass "${MORPHE_KEY_PASSWORD}" \
            -srcalias Morphe \
            -destkeystore "${SIGNING_KEYSTORE_PATH}" \
            -deststoretype JKS \
            -deststorepass public \
            -destkeypass public \
            -destalias public \
            -noprompt

          chmod 600 "${SIGNING_KEYSTORE_PATH}"
          rm -f "${SOURCE_KEYSTORE}"

      - name: Build APK
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          TRAWL_URL: http://localhost:8191
          MORPHE_TEST_FORCE_REBUILD: "true"
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/morphe-signing.jks
          SIGNING_KEYSTORE_TYPE: JKS
          SIGNING_KEY_ALIAS: public
          SIGNING_KEYSTORE_PASSWORD: public
          SIGNING_KEY_PASSWORD: public
        run: |
          set -euo pipefail
          echo "Testing full provider/version fallback for ${{ matrix.app_name }} / ${{ matrix.source }} / ${{ matrix.arch }}"

          python -m src

          apk_count=$(find . -maxdepth 1 -type f -name "*.apk" | wc -l)
          echo "Produced APKs: $apk_count"

          if [ "$apk_count" -eq 0 ]; then
            echo "::error::Test build produced no APK."
            exit 1
          fi

          ls -lh *.apk

      - name: Cleanup Signing Keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/morphe-signing.bks" "${RUNNER_TEMP}/morphe-signing.jks"

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: pre-final-${{ matrix.app_name }}-${{ matrix.source }}-${{ matrix.arch }}
          path: "*.apk"
          if-no-files-found: error
