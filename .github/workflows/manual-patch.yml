name: Manual Patch and Update

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name (from apps/ folder)'
        required: true
        type: string
        default: 'youtube'
      source:
        description: 'Patch source ID (from config/morphe-config.json)'
        required: true
        type: string
        default: 'morphe'
      version:
        description: 'Specific version (leave empty for latest)'
        required: false
        type: string
        default: ''
      architecture:
        description: 'Architecture to build'
        required: false
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - universal
        default: 'universal'
      replace_in_release:
        description: 'Publish the APK as a new release'
        required: true
        type: boolean
        default: true

jobs:
  manual-patch:
    runs-on: ubuntu-latest
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        options: --shm-size=1gb
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Synchronize Configuration
        run: python scripts/sync_config.py
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Build APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          SOURCE: ${{ inputs.source }}
          ARCH: ${{ inputs.architecture }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAWL_URL: http://localhost:8191
          MORPHE_MANUAL_VERSION: ${{ inputs.version }}
        run: |
          echo "🔧 Building ${{ inputs.app_name }} with ${{ inputs.source }} for ${{ inputs.architecture }} architecture..."
          python -m src
      
      - name: Find Built APK
        id: find-apk
        run: |
          # Find the built APK file(s)
          apk_files=$(ls -1 *.apk 2>/dev/null)
          if [ -z "$apk_files" ]; then
            echo "❌ No APK files found"
            exit 1
          fi
          
          # Fix for multi-line output in GitHub Actions
          {
            echo "apk_files<<EOF"
            echo "$apk_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          
          echo "apk_count=$(echo "$apk_files" | wc -l)" >> "$GITHUB_OUTPUT"
          
          # Print for debugging
          echo "Found these APKs:"
          echo "$apk_files"
      
      - name: Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-apk-${{ inputs.app_name }}-${{ inputs.architecture }}
          path: "*.apk"
      
      - name: Publish as New Release
        if: ${{ inputs.replace_in_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A manual build is published as its own NEW release (never by editing
          # an old one), so release trackers such as Obtainium pick it up.
          # It is NOT flagged "latest": the automatic workflow keeps reading
          # manifest.json from the newest automatic release.
          TAG="manual-${{ inputs.app_name }}-${{ inputs.architecture }}-${GITHUB_RUN_NUMBER}"
          TITLE="Manual build - ${{ inputs.app_name }} ${{ inputs.architecture }} - $(date -u +'%Y-%m-%d %H:%M') UTC"

          {
            echo "# Manual build"
            echo ""
            for apk in *.apk; do
              echo "- $apk"
            done
            echo ""
            echo "**App:** ${{ inputs.app_name }}"
            echo "**Architecture:** ${{ inputs.architecture }}"
            echo "**Source:** ${{ inputs.source }}"
          } > release_notes.md

          gh release create "$TAG" *.apk \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --target "$GITHUB_SHA" \
            --latest=false

          echo "✅ Published release $TAG"
          echo "🔗 $(gh release view "$TAG" --json url --jq .url)"
          for apk in *.apk; do
            echo "  - https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${apk}"
          done
