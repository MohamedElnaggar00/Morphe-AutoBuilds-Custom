name: Update Patch Selection

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview patch-selection updates without committing them"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  update-selection:
    name: Update All Patch Selections
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Synchronize All Patch Selections
        env:
          GITHUB_TOKEN: ${ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${ inputs.dry_run }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          ROOT = Path.cwd()
          PATCH_CONFIG = ROOT / "patch-config.json"
          SOURCES_DIR = ROOT / "sources"
          PATCHES_DIR = ROOT / "patches"
          TOKEN = os.environ.get("GITHUB_TOKEN", "")
          DRY_RUN = os.environ.get("DRY_RUN", "false").lower() == "true"

          # Permanent local policy:
          # Hushfeed includes every upstream patch except AMOLED dark theme.
          AUTO_ENABLE_EXCLUSIONS = {
              "hushfeed": {"AMOLED dark theme"},
          }

          def api_get_json(url):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "Morphe-AutoBuilds-Custom/update-patch-selection",
              }
              if TOKEN:
                  headers["Authorization"] = f"Bearer {TOKEN}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def load_upstream_patches(source):
              source_file = SOURCES_DIR / f"{source}.json"
              if not source_file.exists():
                  raise RuntimeError(f"Missing source configuration: {source_file}")

              source_entries = json.loads(source_file.read_text(encoding="utf-8"))
              remote = [
                  item for item in source_entries
                  if isinstance(item, dict)
                  and item.get("user")
                  and item.get("repo")
                  and item.get("repo") != "morphe-cli"
              ]

              if not remote:
                  return None, None

              upstream_repo = remote[-1]
              user = upstream_repo["user"]
              repo = upstream_repo["repo"]

              metadata_url = f"https://api.github.com/repos/{user}/{repo}/contents/patches-list.json"
              try:
                  metadata = api_get_json(metadata_url)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None, f"{user}/{repo}"
                  raise RuntimeError(
                      f"Could not query {user}/{repo}/patches-list.json: HTTP {exc.code}"
                  ) from exc

              download_url = metadata.get("download_url")
              if not download_url:
                  encoded = metadata.get("content", "")
                  if metadata.get("encoding") == "base64" and encoded:
                      raw = base64.b64decode(encoded).decode("utf-8")
                  else:
                      raise RuntimeError(
                          f"No downloadable content returned for {user}/{repo}/patches-list.json"
                      )
              else:
                  request = urllib.request.Request(
                      download_url,
                      headers={
                          "User-Agent": "Morphe-AutoBuilds-Custom/update-patch-selection"
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read().decode("utf-8")

              payload = json.loads(raw)
              patches = payload.get("patches")
              if not isinstance(patches, list):
                  raise RuntimeError(
                      f"Invalid patches-list.json from {user}/{repo}: missing patches[]"
                  )

              names = []
              seen = set()
              for patch in patches:
                  name = patch.get("name") if isinstance(patch, dict) else None
                  if isinstance(name, str) and name.strip():
                      name = name.strip()
                      if name not in seen:
                          names.append(name)
                          seen.add(name)

              if not names:
                  raise RuntimeError(f"No patch names found in {user}/{repo}/patches-list.json")

              return names, f"{user}/{repo} @ {payload.get('version', 'unknown')}"

          patch_entries = json.loads(PATCH_CONFIG.read_text(encoding="utf-8")).get("patch_list", [])
          configured_sources = {
              str(entry.get("source")).strip()
              for entry in patch_entries
              if isinstance(entry, dict) and entry.get("source")
          }

          changed = []
          skipped = []

          patch_files = sorted(PATCHES_DIR.glob("*.txt"))

          for path in patch_files:
              stem = path.stem

              # Match the local file to a configured source by suffix:
              # e.g. instagram-piko-instagram -> piko-instagram.
              candidates = [
                  source for source in configured_sources
                  if stem.endswith(f"-{source}")
              ]
              if not candidates:
                  skipped.append((path, "no matching source in patch-config.json"))
                  continue

              source = max(candidates, key=len)
              upstream, origin = load_upstream_patches(source)

              if upstream is None:
                  skipped.append((path, f"no patches-list.json found for {origin}"))
                  continue

              upstream_set = set(upstream)
              exclusions = AUTO_ENABLE_EXCLUSIONS.get(source, set())

              original_lines = path.read_text(encoding="utf-8").splitlines()
              selection_indices = []
              existing_order = []
              existing_sign = {}

              for index, raw_line in enumerate(original_lines):
                  line = raw_line.rstrip()
                  if line[:1] in "+-":
                      name = line[1:].strip()
                      if name:
                          selection_indices.append(index)
                          existing_order.append(name)
                          existing_sign[name] = line[:1]

              if selection_indices:
                  prefix = original_lines[:selection_indices[0]]
                  suffix = original_lines[selection_indices[-1] + 1:]
              else:
                  prefix = original_lines
                  suffix = []

              # Preserve all existing enabled/disabled choices that still exist upstream.
              # Every newly discovered upstream patch is automatically enabled (+).
              selection = []
              seen = set()

              for name in existing_order:
                  if name in exclusions:
                      continue
                  if name in upstream_set:
                      selection.append((existing_sign[name], name))
                      seen.add(name)

              for name in upstream:
                  if name in exclusions or name in seen:
                      continue
                  selection.append(("+", name))
                  seen.add(name)

              output_lines = prefix + [f"{sign} {name}" for sign, name in selection] + suffix
              new_content = "\n".join(output_lines) + "\n"
              old_content = path.read_text(encoding="utf-8")

              added = [
                  name for name in upstream
                  if name not in existing_sign and name not in exclusions
              ]
              removed = [
                  name for name in existing_order
                  if name not in upstream_set or name in exclusions
              ]

              print(f"\n=== {path} ===")
              print(f"Upstream: {origin}")
              print(f"Upstream patches: {len(upstream)}")
              print(f"Local selections after sync: {len(selection)}")
              print(f"New patches enabled: {len(added)}")
              print(f"Removed/obsolete entries: {len(removed)}")

              for name in added:
                  print(f"  + NEW: {name}")
              for name in removed:
                  print(f"  - REMOVED/EXCLUDED: {name}")

              if new_content != old_content:
                  changed.append(path)
                  if not DRY_RUN:
                      path.write_text(new_content, encoding="utf-8")
              else:
                  print("  -> already up to date")

          if DRY_RUN:
              print("\nPREVIEW ONLY: no files were committed.")
          elif not changed:
              print("\nNo patch-selection changes detected; nothing to commit.")
          else:
              print("\nFiles updated:")
              for path in changed:
                  print(f"  - {path}")

          if skipped:
              print("\nSkipped:")
              for path, reason in skipped:
                  print(f"  - {path}: {reason}")
          PY

      - name: Validate Patch Selection Syntax
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          for path in sorted(Path("patches").glob("*.txt")):
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not line or line.lstrip().startswith("#") or line.startswith("@"):
                      continue
                  if line[:1] not in "+-":
                      raise SystemExit(
                          f"Invalid patch-selection line in {path}:{number}: {line!r}"
                      )

          print("Patch selection syntax is valid.")
          PY

      - name: Commit Patch Selection Updates
        if: ${ inputs.dry_run == false }}
        run: |
          set -euo pipefail

          if git diff --quiet -- patches; then
            echo "No patch-selection changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add patches/
          git commit -m "chore: update patch selections"
          git push origin HEAD:main

          echo "Patch selection update committed successfully."
