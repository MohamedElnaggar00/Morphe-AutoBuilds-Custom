name: Test Source Contract Validation

on:
  push:
    branches:
      - test/source-contract-validation
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile Changed Python Modules
        run: |
          python -m py_compile src/utils.py src/downloader.py src/__main__.py tests/test_version_selection.py

      - name: Run Regression Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
