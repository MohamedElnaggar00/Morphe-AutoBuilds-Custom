name: Watch Patch Source Releases

on:
  schedule:
    # Check patch sources every 12 hours, at minute 43.
    - cron: "43 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout watcher state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize watcher state with latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Check patch source releases and dispatch builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          STATE_FILE="patch-release-state.json"
          if [ ! -f "${STATE_FILE}" ]; then
            echo "::error::Missing ${STATE_FILE}"
            exit 1
          fi

          sources=(
            "MorpheApp/morphe-patches"
            "crimera/piko-newx"
            "crimera/piko"
            "jasonwu1994/Gboard-patches"
            "hxreborn/morphe-patches"
            "SysAdminDoc/hushfeed"
            "icysymmetra/tiktok-patches-for-morphe"
            "hoo-dles/morphe-patches"
            "SysAdminDoc/HushMessenger"
            "SysAdminDoc/Hushfacebook"
            "SysAdminDoc/HushGram"
            "rushiranpise/morphe-patches"
          )

          changed=0
          changed_releases='[]'

          for source_repo in "${sources[@]}"; do
            echo "Checking ${source_repo}..."

            if ! release_json="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${source_repo}/releases/latest")"; then
              echo "No latest stable release found for ${source_repo}; skipping."
              continue
            fi

            release_id="$(jq -r '.id // empty' <<<"${release_json}")"
            tag_name="$(jq -r '.tag_name // empty' <<<"${release_json}")"
            published_at="$(jq -r '.published_at // empty' <<<"${release_json}")"
            html_url="$(jq -r '.html_url // empty' <<<"${release_json}")"
            is_prerelease="$(jq -r '.prerelease // false' <<<"${release_json}")"
            is_draft="$(jq -r '.draft // false' <<<"${release_json}")"

            if [ -z "${release_id}" ] || [ "${is_prerelease}" = "true" ] || [ "${is_draft}" = "true" ]; then
              echo "Ignoring non-stable release for ${source_repo}; skipping."
              continue
            fi

            previous_id="$(jq -r --arg repo "${source_repo}" '.[$repo] // 0' "${STATE_FILE}")"

            if [ "${release_id}" = "${previous_id}" ]; then
              echo "No new release: ${source_repo} @ ${tag_name}"
              continue
            fi

            echo "NEW PATCH RELEASE: ${source_repo} @ ${tag_name}"

            changed_releases="$(jq -c \
              --arg repo "${source_repo}" \
              --argjson id "${release_id}" \
              --arg tag "${tag_name}" \
              --arg published "${published_at}" \
              --arg url "${html_url}" \
              '. + [{
                patch_repository: $repo,
                release_id: $id,
                tag_name: $tag,
                published_at: $published,
                release_url: $url
              }]' <<<"${changed_releases}")"

            changed=$((changed + 1))
            echo "Queued new patch release: ${source_repo} @ ${tag_name}"
          done

          if [ "${changed}" -gt 0 ]; then
            echo "New patch releases detected: ${changed}"
            echo "Dispatching ONE patch-release event for all detected releases..."

            jq -n \
              --argjson releases "${changed_releases}" \
              '{event_type: "patch-release", client_payload: {patch_releases: $releases}}' \
              | gh api \
                  --method POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Content-Type: application/json" \
                  "/repos/${REPOSITORY}/dispatches" \
                  --input -

            echo "Single patch-release dispatch sent successfully."
            echo "The Auto Build workflow is responsible for processing all detected releases and recording their state on main after successful processing."
          else
            echo "No new patch releases detected."
          fi
