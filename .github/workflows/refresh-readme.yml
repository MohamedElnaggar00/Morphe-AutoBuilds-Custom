name: Refresh README

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    paths:
      - "config/morphe-config.json"
      - "scripts/update_readme.py"
      - "scripts/sync_config.py"
      - ".github/workflows/refresh-readme.yml"

permissions:
  contents: write

concurrency:
  group: morphe-config-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install requests beautifulsoup4

      - name: Synchronize Configuration
        run: python scripts/sync_config.py

      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit README
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- README.md; then
            echo 'README is already up to date.'
            exit 0
          fi
          git add README.md
          git commit -m 'docs: refresh README from current patch metadata'
          git push origin "HEAD:$GITHUB_REF_NAME"
