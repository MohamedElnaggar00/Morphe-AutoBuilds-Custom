name: Manage Configuration

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Configuration operation"
        required: true
        type: choice
        options:
          - add-app
          - enable-build
          - disable-build
          - set-arches
          - add-enable-patch
          - remove-enable-patch
          - add-disable-patch
          - remove-disable-patch
          - clear-patches
        default: enable-build
      app_name:
        description: "Application ID (lowercase, e.g. my-app)"
        required: true
        type: string
      display_name:
        description: "Display name"
        required: false
        type: string
        default: ""
      package_name:
        description: "Android package name, e.g. com.example.app"
        required: false
        type: string
        default: ""
      provider:
        description: "Download provider"
        required: false
        type: choice
        options:
          - apkmirror
          - apkpure
          - uptodown
          - aptoide
        default: apkmirror
      provider_ref:
        description: "APKMirror: org/name; other providers: app name"
        required: false
        type: string
        default: ""
      source:
        description: "Existing patch source ID from config/morphe-config.json"
        required: true
        type: string
      architecture:
        description: "Architecture for a new app/build"
        required: false
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
          - universal
        default: arm64-v8a
      type:
        description: "APKMirror artifact type (APK/BUNDLE)"
        required: false
        type: string
        default: ""
      dpi:
        description: "APKMirror DPI (e.g. nodpi)"
        required: false
        type: string
        default: ""
      value:
        description: "Patch name or comma-separated architectures for other operations"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: morphe-config-management
  cancel-in-progress: false

jobs:
  manage:
    name: Apply Configuration Change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Change and Synchronize
        env:
          CONFIG_OPERATION: ${{ inputs.operation }}
          CONFIG_APP_NAME: ${{ inputs.app_name }}
          CONFIG_SOURCE: ${{ inputs.source }}
          CONFIG_VALUE: ${{ inputs.value }}
          CONFIG_DISPLAY_NAME: ${{ inputs.display_name }}
          CONFIG_PACKAGE_NAME: ${{ inputs.package_name }}
          CONFIG_PROVIDER: ${{ inputs.provider }}
          CONFIG_PROVIDER_REF: ${{ inputs.provider_ref }}
          CONFIG_ARCHITECTURE: ${{ inputs.architecture }}
          CONFIG_TYPE: ${{ inputs.type }}
          CONFIG_DPI: ${{ inputs.dpi }}
        run: |
          python scripts/manage_config.py \
            --operation "$CONFIG_OPERATION" \
            --app-name "$CONFIG_APP_NAME" \
            --source "$CONFIG_SOURCE" \
            --value "$CONFIG_VALUE" \
            --display-name "$CONFIG_DISPLAY_NAME" \
            --package-name "$CONFIG_PACKAGE_NAME" \
            --provider "$CONFIG_PROVIDER" \
            --provider-ref "$CONFIG_PROVIDER_REF" \
            --architecture "$CONFIG_ARCHITECTURE" \
            --provider-type "$CONFIG_TYPE" \
            --dpi "$CONFIG_DPI"

      - name: Show Changes
        run: |
          git status --short
          git diff -- config/morphe-config.json patch-config.json arch-config.json apps sources patches

      - name: Commit and Push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- config/morphe-config.json patch-config.json arch-config.json apps sources patches; then
            echo "No configuration changes were necessary."
            exit 0
          fi

          git add config/morphe-config.json patch-config.json arch-config.json apps sources patches
          git commit -m "chore: manage repository configuration"
          git push origin "HEAD:$GITHUB_REF_NAME"
