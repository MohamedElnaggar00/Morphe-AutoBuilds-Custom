name: Auto Build and Release Morphe

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  repository_dispatch:
    types: [patch-release]

  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "Rebuild every app (ignore incremental check)"
        type: boolean
        required: false
        default: false
      cleanup_old_releases:
        description: "Delete older generated releases; keep only the newest per app/source/architecture"
        type: boolean
        required: false
        default: false
  # schedule:
  #   - cron: '0 6 * * *' # Daily fallback check at 6:00 AM UTC

concurrency:
  group: morphe-auto-build
  cancel-in-progress: false

jobs:
  download-tools:
    name: Download Morphe Tools
    runs-on: ubuntu-latest
    if: ${{ false }}
    outputs:
      cache-key: ${{ steps.cache-key.outputs.cache-key }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      
      - name: Download Morphe Tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools
          curl -L "https://github.com/revanced/revanced-cli/releases/latest/download/revanced-cli-all.jar" -o tools/revanced-cli.jar
          curl -L "https://github.com/revanced/revanced-patches/releases/latest/download/patches.jar" -o tools/patches.jar
          curl -L "https://github.com/revanced/revanced-integrations/releases/latest/download/app-release-unsigned.apk" -o tools/integrations.apk
      
      - name: Cache Tools
        uses: actions/cache@v4
        id: cache-tools
        with:
          path: tools/
          key: revanced-tools-${{ hashFiles('patch-config.json', 'arch-config.json') }}
      
      - name: Generate Cache Key
        id: cache-key
        run: echo "cache-key=${{ steps.cache-tools.outputs.cache-key || 'no-cache' }}" >> $GITHUB_OUTPUT

  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      build_matrix: ${{ steps.check.outputs.build_matrix }}
      update_count: ${{ steps.check.outputs.update_count }}
      total_count: ${{ steps.check.outputs.total_count }}
      carry_count: ${{ steps.check.outputs.carry_count }}
      incremental: ${{ steps.check.outputs.incremental }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate GitHub Auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_github_auth.py

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          python -m pip install --upgrade gplaydl
          echo "Installed gplaydl version: $(python -c 'import importlib.metadata as m; print(m.version("gplaydl"))')"
          pip install requests beautifulsoup4

      - name: Validate Release Planner Syntax
        run: |
          python -m py_compile scripts/check_release_updates.py scripts/check_app_updates.py

      - name: Run Version Selection Regression Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Incremental Update Check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Universal Morphe patches are included in builds, but a release
          # from MorpheApp/morphe-patches is NOT a global rebuild trigger.
          # Rebuild decisions remain incremental and are driven by each app's
          # configured patch source/version (or an explicit manual full rebuild).
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild || 'false' }}
        run: |
          python scripts/check_release_updates.py

      - name: Show Plan Summary
        run: |
          echo "Total entries:   ${{ steps.check.outputs.total_count }}"
          echo "Need rebuild:    ${{ steps.check.outputs.update_count }}"
          echo "Carry over:      ${{ steps.check.outputs.carry_count }}"
          echo "Incremental:     ${{ steps.check.outputs.incremental }}"

      - name: Upload Plan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: |
            build_matrix.json
            release_plan.json
          if-no-files-found: warn
          retention-days: 1

  patch-apps:
    name: Read Configuration
    needs: check-updates
    runs-on: ubuntu-latest
    if: needs.check-updates.outputs.has_updates == 'true'
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Build Matrix from Check
        id: read-matrix
        run: |
          MATRIX='${{ needs.check-updates.outputs.build_matrix }}'
          if [ -z "$MATRIX" ] || [ "$MATRIX" = "null" ]; then
            echo "Empty matrix from check; falling back to full patch-config.json"
            MATRIX=$(jq -c '.patch_list' patch-config.json)
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX" | head -c 1000

  update-readme:
    name: Update README
    needs: [check-updates, build-apps, create-app-releases]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          pip install requests curl-cffi PyGithub

      - name: Refresh README and synchronize repository state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCH_EVENT: ${{ github.event_name }}
          PATCH_REPOSITORY: ${{ github.event.client_payload.patch_repository }}
          PATCH_RELEASE_ID: ${{ github.event.client_payload.release_id }}
          PATCH_RELEASES_JSON: ${{ toJSON(github.event.client_payload.patch_releases) }}
          HAS_UPDATES: ${{ needs.check-updates.outputs.has_updates }}
          BUILD_RESULT: ${{ needs.build-apps.result }}
          PUBLISH_RESULT: ${{ needs.create-app-releases.result }}
        run: |
          set -euo pipefail

          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            echo "===== Repository finalization attempt $attempt/$max_attempts ====="

            # Start each attempt from the newest remote main.
            git fetch origin main
            git reset --hard origin/main

            # Regenerate from the exact repository state we just synchronized to.
            python scripts/update_readme.py

            # Record every watched release only after the build/publication succeeds.
            record_state=false
            if [ "$PATCH_EVENT" = "repository_dispatch" ]; then
              if [ "$HAS_UPDATES" = "false" ] ||
                 { [ "$BUILD_RESULT" = "success" ] && [ "$PUBLISH_RESULT" = "success" ]; }; then
                record_state=true
              fi
            fi

            if [ "$record_state" = "true" ]; then
              tmp_state="patch-release-state.json.tmp"

              # New watcher payload: one dispatch can contain multiple source releases.
              if [ -n "${PATCH_RELEASES_JSON:-}" ]                 && jq -e '
                  type == "array"
                  and all(.[]; (.patch_repository | type) == "string"
                          and (.patch_repository | length) > 0
                          and ((.release_id | type) == "number"
                               or ((.release_id | type) == "string"
                                   and (.release_id | test("^[0-9]+$")))))
                ' <<<"$PATCH_RELEASES_JSON" >/dev/null 2>&1; then

                jq --argjson releases "$PATCH_RELEASES_JSON" '
                  reduce $releases[] as $item (.;
                    .[$item.patch_repository] = ($item.release_id | tonumber)
                  )
                ' patch-release-state.json > "$tmp_state"

                echo "Recorded monitored releases from one batched dispatch:"
                jq -r '.[] | "  - \(.patch_repository) @ release \(.release_id)"' <<<"$PATCH_RELEASES_JSON"
              # Legacy single-release payload support keeps older/manual dispatches safe.
              elif [ -n "${PATCH_REPOSITORY:-}" ]                 && [ -n "${PATCH_RELEASE_ID:-}" ]                 && [[ "${PATCH_RELEASE_ID}" =~ ^[0-9]+$ ]]; then

                jq --arg repo "$PATCH_REPOSITORY"                    --argjson id "$PATCH_RELEASE_ID"                    '.[$repo] = $id'                    patch-release-state.json > "$tmp_state"

                echo "Recorded monitored release: $PATCH_REPOSITORY @ $PATCH_RELEASE_ID"
              else
                echo "::warning::repository_dispatch completed without a valid patch release payload; monitored release state was not changed."
                rm -f "$tmp_state"
              fi

              if [ -f "$tmp_state" ]; then
                mv "$tmp_state" patch-release-state.json
              fi
            fi

            if git diff --quiet -- README.md patch-release-state.json; then
              echo "README and monitored release state are already up to date."
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md patch-release-state.json
            git commit -m "docs: refresh README and patch release state"

            # If main advanced after our fetch/reset, the push can be rejected.
            # The next attempt re-syncs to the new main and regenerates everything.
            if git push origin HEAD:main; then
              echo "Repository finalization push succeeded."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Remote main advanced during the push; re-syncing and retrying..."
              sleep 2
            fi
          done

          echo "::error::Could not publish synchronized README/state after ${max_attempts} attempts."
          exit 1

  build-apps:
    name: Build Applications
    needs: patch-apps
    runs-on: ubuntu-latest
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        env:
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        options: --shm-size=1gb
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.patch-apps.outputs.matrix) }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Cached Tools
        uses: actions/cache@v4
        with:
          path: tools/
          key: revanced-tools-${{ hashFiles('patch-config.json', 'arch-config.json') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Signing Keystore
        env:
          MORPHE_KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
          MORPHE_KEY_PASSWORD: Morphe
        run: |
          set -euo pipefail

          if [ -z "${MORPHE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing GitHub Actions secret MORPHE_KEYSTORE_BASE64"
            echo "Add the base64-encoded BKS keystore in Settings > Secrets and variables > Actions."
            exit 1
          fi

          # The supplied signing key is BKS. The original Morphe-AutoBuilds
          # workflow signs with a JKS file, so convert the same key material
          # to JKS at runtime instead of committing the private key.
          sudo apt-get update
          sudo apt-get install -y libbcprov-java

          SOURCE_KEYSTORE="${RUNNER_TEMP}/morphe-signing.bks"
          SIGNING_KEYSTORE_PATH="${RUNNER_TEMP}/morphe-signing.jks"

          printf "%s" "${MORPHE_KEYSTORE_BASE64}" | base64 --decode > "${SOURCE_KEYSTORE}"
          chmod 600 "${SOURCE_KEYSTORE}"

          if [ ! -s "${SOURCE_KEYSTORE}" ]; then
            echo "::error::Decoded signing keystore is empty."
            exit 1
          fi

          keytool -importkeystore \
            -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider \
            -providerpath /usr/share/java/bcprov.jar \
            -srckeystore "${SOURCE_KEYSTORE}" \
            -srcstoretype BKS \
            -srcstorepass "" \
            -srckeypass "${MORPHE_KEY_PASSWORD}" \
            -srcalias Morphe \
            -destkeystore "${SIGNING_KEYSTORE_PATH}" \
            -deststoretype JKS \
            -deststorepass public \
            -destkeypass public \
            -destalias public \
            -noprompt

          chmod 600 "${SIGNING_KEYSTORE_PATH}"
          rm -f "${SOURCE_KEYSTORE}"

          if [ ! -s "${SIGNING_KEYSTORE_PATH}" ]; then
            echo "::error::JKS signing keystore conversion failed."
            exit 1
          fi

      - name: Build APK
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          TRAWL_URL: http://localhost:8191
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/morphe-signing.jks
          SIGNING_KEYSTORE_TYPE: JKS
          SIGNING_KEY_ALIAS: public
          SIGNING_KEYSTORE_PASSWORD: public
          SIGNING_KEY_PASSWORD: public
        run: |
          echo "Building ${{ matrix.app_name }} with ${{ matrix.source }}..."
          sleep $((RANDOM % 30)).$((RANDOM % 100))

          python -m src

          # An APK that is already published in some release is a normal skip,
          # not a failed build. Only a real build with no output should fail.
          apk_count=$(find . -maxdepth 1 -type f -name "*.apk" | wc -l)
          echo "Produced APKs: $apk_count"
          if [ "$apk_count" -eq 0 ]; then
            if [ -f .build-skipped ]; then
              echo "⏭️ Build skipped: APK is already published in an existing release."
              exit 0
            fi
            echo "::error::Build completed without producing an APK."
            exit 1
          fi

      - name: Cleanup Signing Keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/morphe-signing.bks" "${RUNNER_TEMP}/morphe-signing.jks"

      - name: Record Build Outputs
        if: always()
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p build_records
          # Record every produced APK so manifest can map (app, source, arch) -> filename
          for apk in *.apk; do
            [ -e "$apk" ] || continue
            # record_build.py now detects arch from filename automatically
            APK_PATH="$apk" python scripts/record_build.py || true
          done
          echo "Records produced:"
          ls -la build_records/ 2>/dev/null || echo "(no records)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app_name }}-${{ matrix.source }}
          path: "*.apk"

      - name: Upload Build Records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-records-${{ matrix.app_name }}-${{ matrix.source }}
          path: build_records/
          if-no-files-found: ignore

  create-app-releases:
    name: Publish Independent App Releases
    needs: [check-updates, build-apps]
    runs-on: ubuntu-latest
    if: always() && needs.check-updates.outputs.has_updates == 'true'
    permissions:
      contents: write

    steps:
      - name: Download Built APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-apks
          pattern: apk-*
          merge-multiple: false

      - name: Download Build Records
        uses: actions/download-artifact@v4
        with:
          path: ./all-records
          pattern: build-records-*
          merge-multiple: false

      - name: Collect Built APKs
        run: |
          set -euo pipefail
          mkdir -p ./release-apks
          find ./all-apks -type f -name "*.apk" -exec cp -f {} ./release-apks/ \;

          count=$(find ./release-apks -maxdepth 1 -type f -name "*.apk" | wc -l)
          echo "Built APKs ready for independent releases: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No APKs were produced by the build jobs."
            exit 1
          fi
          ls -lh ./release-apks

      - name: Publish One Release Per App and Patch Source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          published=0

          while IFS= read -r record; do

            filename="$(jq -r '.apk // empty' "$record")"
            app_name="$(jq -r '.app_name // empty' "$record")"
            source_name="$(jq -r '.source // empty' "$record")"
            arch="$(jq -r '.arch // empty' "$record")"

            if [ -z "$filename" ] || [ -z "$app_name" ] || [ -z "$source_name" ] || [ -z "$arch" ]; then
              echo "::error::Incomplete build record: $record"
              exit 1
            fi

            apk="./release-apks/$filename"
            if [ ! -f "$apk" ]; then
              echo "::error::APK referenced by $record was not found: $filename"
              exit 1
            fi

            patch_version="$(printf '%s\n' "$filename" | sed -nE 's/.*-patch-v(.+)-app-v(.+)\.apk$/\1/p')"
            app_version="$(printf '%s\n' "$filename" | sed -nE 's/.*-patch-v(.+)-app-v(.+)\.apk$/\2/p')"

            if [ -z "$patch_version" ] || [ -z "$app_version" ]; then
              echo "::error::Could not extract patch/app versions from $filename"
              exit 1
            fi

            title="${app_name} v${app_version} — Patch v${patch_version} — ${source_name} — ${arch}"

            safe_app="$(printf '%s' "$app_name" | tr -cs 'A-Za-z0-9._-' '-')"
            safe_patch="$(printf '%s' "$patch_version" | tr -cs 'A-Za-z0-9._-' '-')"
            safe_app_version="$(printf '%s' "$app_version" | tr -cs 'A-Za-z0-9._-' '-')"
            safe_source="$(printf '%s' "$source_name" | tr -cs 'A-Za-z0-9._-' '-')"
            tag="build-${safe_app}-v${safe_app_version}-patch-v${safe_patch}-${safe_source}-${GITHUB_RUN_NUMBER}"

            notes_file="${RUNNER_TEMP}/${tag}.md"
            {
              echo "- **Application:** ${app_name}"
              echo "- **Application version:** ${app_version}"
              echo "- **Patch source:** ${source_name}"
              echo "- **Patch version:** ${patch_version}"
              echo "- **Architecture:** ${arch}"
              echo "- **APK:** ${filename}"
              echo
              echo "This release contains only this app/source build."
            } > "$notes_file"

            if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release upload "$tag" "$apk" --clobber --repo "$GH_REPO"
              gh release edit "$tag" --repo "$GH_REPO" --title "$title" --notes-file "$notes_file"
            else
              gh release create "$tag" "$apk" \
                --repo "$GH_REPO" \
                --title "$title" \
                --notes-file "$notes_file" \
                --target "$GITHUB_SHA"
            fi

            if gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[].name' | grep -Fxq "$filename"; then
              echo "Published and verified: $filename"
              published=$((published + 1))
            else
              echo "::error::Release $tag was created but $filename is missing."
              exit 1
            fi
          done < <(find ./all-records -type f -name "*.json" -print)

          echo "Independent releases published: $published"

      - name: Enforce Release Retention (Dry Run by Default)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CLEANUP_OLD_RELEASES: ${{ inputs.cleanup_old_releases || 'false' }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          repo = os.environ["GH_REPO"]
          dry_run = os.environ.get("CLEANUP_OLD_RELEASES", "false").lower() != "true"

          print("Release retention policy: keep exactly one newest generated release per")
          print("  (Application, Patch source, Architecture)")
          print(f"Mode: {'DRY RUN — no releases will be deleted' if dry_run else 'LIVE — older releases will be deleted'}")

          cmd = [
              "gh", "api", "--paginate", "--slurp",
              f"/repos/{repo}/releases?per_page=100",
          ]
          result = subprocess.run(cmd, check=True, capture_output=True, text=True)
          pages = json.loads(result.stdout or "[]")
          releases = [release for page in pages for release in page]

          field_patterns = {
              "app": r"^- \\*\\*Application:\\*\\* (.+)$",
              "source": r"^- \\*\\*Patch source:\\*\\* (.+)$",
              "arch": r"^- \\*\\*Architecture:\\*\\* (.+)$",
          }

          groups = {}
          skipped = 0
          generated = 0

          for release in releases:
              tag = release.get("tag_name") or ""
              if not tag.startswith("build-") or release.get("draft"):
                  continue

              generated += 1
              body = release.get("body") or ""
              values = {}
              for key, pattern in field_patterns.items():
                  match = re.search(pattern, body, re.MULTILINE)
                  if match:
                      values[key] = match.group(1).strip()

              if len(values) != 3:
                  skipped += 1
                  print(f"::warning::Skipping generated release with incomplete retention metadata: {tag}")
                  continue

              group = (values["app"], values["source"], values["arch"])
              groups.setdefault(group, []).append(release)

          print(f"Generated releases inspected: {generated}")
          print(f"Retention groups found: {len(groups)}")
          print(f"Releases skipped due to missing metadata: {skipped}")

          deletions = []
          for group, items in sorted(groups.items()):
              def sort_key(item):
                  return (item.get("published_at") or item.get("created_at") or "", int(item.get("id") or 0))

              items.sort(key=sort_key, reverse=True)
              keep = items[0]
              app, source, arch = group
              print(f"\n[{app} | {source} | {arch}]")
              print(f"  KEEP: {keep['tag_name']} — {keep.get('name') or 'unnamed release'}")

              for old in items[1:]:
                  tag = old["tag_name"]
                  if old.get("is_immutable"):
                      print(f"  SKIP (immutable): {tag}")
                      continue

                  deletions.append((group, tag, old.get("name") or "unnamed release"))
                  if dry_run:
                      print(f"  WOULD DELETE: {tag} — {old.get('name') or 'unnamed release'}")
                  else:
                      print(f"  DELETE: {tag} — {old.get('name') or 'unnamed release'}")
                      subprocess.run(
                          ["gh", "release", "delete", tag, "--repo", repo, "--yes", "--cleanup-tag"],
                          check=True,
                      )

          if dry_run:
              print(f"\nDry-run complete. Releases that would be deleted: {len(deletions)}")
              print("No GitHub Release or tag was modified.")
              sys.exit(0)

          verify = subprocess.run(cmd, check=True, capture_output=True, text=True)
          verify_pages = json.loads(verify.stdout or "[]")
          remaining = [release for page in verify_pages for release in page]
          remaining_groups = {}
          for release in remaining:
              tag = release.get("tag_name") or ""
              if not tag.startswith("build-") or release.get("draft"):
                  continue
              body = release.get("body") or ""
              values = {}
              for key, pattern in field_patterns.items():
                  match = re.search(pattern, body, re.MULTILINE)
                  if match:
                      values[key] = match.group(1).strip()
              if len(values) == 3:
                  remaining_groups.setdefault((values["app"], values["source"], values["arch"]), []).append(tag)

          violations = {group: tags for group, tags in remaining_groups.items() if len(tags) > 1}
          if violations:
              for group, tags in violations.items():
                  print(f"::error::Retention violation for {group}: {tags}")
              sys.exit(1)

          print(f"\nLive retention complete. Deleted releases: {len(deletions)}")
          print("Verified: no retention group has more than one generated release.")
          PY

      - name: Show Published Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --repo "$GH_REPO" --limit 30

  cleanup:
    name: Cleanup Workflow Runs
    needs: [build-apps, create-app-releases]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
    steps:
