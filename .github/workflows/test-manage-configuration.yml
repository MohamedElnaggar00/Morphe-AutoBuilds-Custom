name: Test Manage Configuration

on:
  push:
    branches:
      - redesign/manage-configuration-20261002
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and unit tests
        run: |
          python -m py_compile scripts/manage_config.py scripts/sync_config.py scripts/update_readme.py
          python -m unittest tests.test_manage_configuration -v
