name: Sync Configuration

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    paths:
      - "config/morphe-config.json"
      - "scripts/sync_config.py"

permissions:
  contents: write

jobs:
  sync:
    name: Validate and Generate Runtime Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Synchronize Configuration
        run: python scripts/sync_config.py

      - name: Show Generated Changes
        run: |
          git status --short
          git diff -- patch-config.json arch-config.json apps sources patches

      - name: Commit Generated Configuration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- patch-config.json arch-config.json apps sources patches; then
            echo "Generated configuration is already up to date."
            exit 0
          fi
          git add patch-config.json arch-config.json apps sources patches
          git commit -m "chore: sync generated configuration"
          git push origin "HEAD:$GITHUB_REF_NAME"
