name: Manage Configuration

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "1) Add application + patch source  2) Edit patch selection  3) Delete application  4) Enable/disable application"
        required: true
        type: choice
        options:
          - add-app
          - edit-patches
          - delete-app
          - set-app-status
        default: add-app

      app_name:
        description: "Existing application. For add-app choose __NEW_APP__ and fill New application ID."
        required: true
        type: choice
        options:
          # BEGIN GENERATED APP OPTIONS
          - "__NEW_APP__"
          - "camscanner"
          - "dwg-fastview"
          - "excel"
          - "facebook"
          - "gboard"
          - "messenger"
          - "reddit"
          - "tiktok"
          - "tiktok-metra"
          - "truecaller"
          - "vpnify"
          - "x"
          - "youtube"
          # END GENERATED APP OPTIONS
        default: __NEW_APP__

      new_app_name:
        description: "New application ID (add-app only), e.g. truecaller"
        required: false
        type: string
        default: ""

      display_name:
        description: "Application display name (add-app only)"
        required: false
        type: string
        default: ""

      package_name:
        description: "Android package name (add-app only), e.g. com.truecaller"
        required: false
        type: string
        default: ""

      provider:
        description: "Original APK download provider (add-app only)"
        required: false
        type: choice
        options:
          - apkmirror
          - apkpure
          - uptodown
          - aptoide
        default: apkmirror

      provider_ref:
        description: "Provider reference: APKMirror uses org/name; other providers use their app name."
        required: false
        type: string
        default: ""

      provider_type:
        description: "APKMirror artifact type (add-app only)"
        required: false
        type: choice
        options:
          - APK
          - BUNDLE
        default: APK

      dpi:
        description: "APKMirror DPI (add-app only), e.g. nodpi"
        required: false
        type: string
        default: nodpi

      architecture:
        description: "Build architecture (add-app only)"
        required: false
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
          - universal
        default: arm64-v8a

      patch_source_url:
        description: "Morphe patch source URL (add-app): GitHub/GitLab repository or Morphe add-source deep link"
        required: false
        type: string
        default: ""

      source:
        description: "Patch source for edit-patches. __AUTO__ works when the selected app has one build/source entry."
        required: false
        type: choice
        options:
