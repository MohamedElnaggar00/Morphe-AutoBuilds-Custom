name: Verify Source-Aware Release Identity

on:
  push:
    paths:
      - "scripts/check_release_updates.py"
      - "src/__main__.py"
      - "tests/test_release_identity.py"
      - "sources/**"
      - ".github/workflows/verify-source-aware-release.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests beautifulsoup4 PyGithub

      - name: Compile changed Python
        run: |
          python -m py_compile scripts/check_release_updates.py src/__main__.py tests/test_release_identity.py

      - name: Run regression suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
