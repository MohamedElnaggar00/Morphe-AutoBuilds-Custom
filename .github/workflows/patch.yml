name: Auto Build and Release Morphe

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "Rebuild every app (ignore incremental check)"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 6 * * *'  # Daily at 6:17 AM UTC

jobs:
  download-tools:
    name: Download Morphe Tools
    runs-on: ubuntu-latest
    if: ${{ false }}
    outputs:
      cache-key: ${{ steps.cache-key.outputs.cache-key }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      
      - name: Download Morphe Tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools
          curl -L "https://github.com/revanced/revanced-cli/releases/latest/download/revanced-cli-all.jar" -o tools/revanced-cli.jar
          curl -L "https://github.com/revanced/revanced-patches/releases/latest/download/patches.jar" -o tools/patches.jar
          curl -L "https://github.com/revanced/revanced-integrations/releases/latest/download/app-release-unsigned.apk" -o tools/integrations.apk
      
      - name: Cache Tools
        uses: actions/cache@v4
        id: cache-tools
        with:
          path: tools/
          key: revanced-tools-${{ hashFiles('patch-config.json', 'arch-config.json') }}
      
      - name: Generate Cache Key
        id: cache-key
        run: echo "cache-key=${{ steps.cache-tools.outputs.cache-key || 'no-cache' }}" >> $GITHUB_OUTPUT

  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      build_matrix: ${{ steps.check.outputs.build_matrix }}
      update_count: ${{ steps.check.outputs.update_count }}
      total_count: ${{ steps.check.outputs.total_count }}
      carry_count: ${{ steps.check.outputs.carry_count }}
      incremental: ${{ steps.check.outputs.incremental }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate GitHub Auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_github_auth.py

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Run Incremental Update Check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild || 'false' }}
        run: |
          python scripts/check_app_updates.py

      - name: Show Plan Summary
        run: |
          echo "Total entries:   ${{ steps.check.outputs.total_count }}"
          echo "Need rebuild:    ${{ steps.check.outputs.update_count }}"
          echo "Carry over:      ${{ steps.check.outputs.carry_count }}"
          echo "Incremental:     ${{ steps.check.outputs.incremental }}"

      - name: Upload Plan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: |
            build_matrix.json
            carry_over.json
            new_manifest.json
          if-no-files-found: warn
          retention-days: 1

  patch-apps:
    name: Read Configuration
    needs: check-updates
    runs-on: ubuntu-latest
    if: needs.check-updates.outputs.has_updates == 'true'
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Build Matrix from Check
        id: read-matrix
        run: |
          MATRIX='${{ needs.check-updates.outputs.build_matrix }}'
          if [ -z "$MATRIX" ] || [ "$MATRIX" = "null" ]; then
            echo "Empty matrix from check; falling back to full patch-config.json"
            MATRIX=$(jq -c '.patch_list' patch-config.json)
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX" | head -c 1000

  update-readme:
    name: Update README
    needs: check-updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Refresh README from patch sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_readme.py

      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh README app and patch list"
          git push

  build-apps:
    name: Build Applications
    needs: patch-apps
    runs-on: ubuntu-latest
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        env:
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        options: --shm-size=1gb
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.patch-apps.outputs.matrix) }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Cached Tools
        uses: actions/cache@v4
        with:
          path: tools/
          key: revanced-tools-${{ hashFiles('patch-config.json', 'arch-config.json') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Signing Keystore
        env:
          MORPHE_KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
          MORPHE_KEY_PASSWORD: Morphe
        run: |
          set -euo pipefail

          if [ -z "${MORPHE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing GitHub Actions secret MORPHE_KEYSTORE_BASE64"
            echo "Add the base64-encoded BKS keystore in Settings > Secrets and variables > Actions."
            exit 1
          fi

          # The supplied signing key is BKS. The original Morphe-AutoBuilds
          # workflow signs with a JKS file, so convert the same key material
          # to JKS at runtime instead of committing the private key.
          sudo apt-get update
          sudo apt-get install -y libbcprov-java

          SOURCE_KEYSTORE="${RUNNER_TEMP}/morphe-signing.bks"
          SIGNING_KEYSTORE_PATH="${RUNNER_TEMP}/morphe-signing.jks"

          printf "%s" "${MORPHE_KEYSTORE_BASE64}" | base64 --decode > "${SOURCE_KEYSTORE}"
          chmod 600 "${SOURCE_KEYSTORE}"

          if [ ! -s "${SOURCE_KEYSTORE}" ]; then
            echo "::error::Decoded signing keystore is empty."
            exit 1
          fi

          keytool -importkeystore \
            -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider \
            -providerpath /usr/share/java/bcprov.jar \
            -srckeystore "${SOURCE_KEYSTORE}" \
            -srcstoretype BKS \
            -srcstorepass "" \
            -srckeypass "${MORPHE_KEY_PASSWORD}" \
            -srcalias Morphe \
            -destkeystore "${SIGNING_KEYSTORE_PATH}" \
            -deststoretype JKS \
            -deststorepass public \
            -destkeypass public \
            -destalias public \
            -noprompt

          chmod 600 "${SIGNING_KEYSTORE_PATH}"
          rm -f "${SOURCE_KEYSTORE}"

          if [ ! -s "${SIGNING_KEYSTORE_PATH}" ]; then
            echo "::error::JKS signing keystore conversion failed."
            exit 1
          fi

      - name: Build APK
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          TRAWL_URL: http://localhost:8191
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/morphe-signing.jks
          SIGNING_KEYSTORE_TYPE: JKS
          SIGNING_KEY_ALIAS: public
          SIGNING_KEYSTORE_PASSWORD: public
          SIGNING_KEY_PASSWORD: public
        run: |
          echo "Building ${{ matrix.app_name }} with ${{ matrix.source }}..."
          sleep $((RANDOM % 30)).$((RANDOM % 100))

          python -m src

          # An APK that is already published in some release is a normal skip,
          # not a failed build. Only a real build with no output should fail.
          apk_count=$(find . -maxdepth 1 -type f -name "*.apk" | wc -l)
          echo "Produced APKs: $apk_count"
          if [ "$apk_count" -eq 0 ]; then
            if [ -f .build-skipped ]; then
              echo "⏭️ Build skipped: APK is already published in an existing release."
              exit 0
            fi
            echo "::error::Build completed without producing an APK."
            exit 1
          fi

      - name: Cleanup Signing Keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/morphe-signing.bks" "${RUNNER_TEMP}/morphe-signing.jks"

      - name: Record Build Outputs
        if: always()
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p build_records
          # Record every produced APK so manifest can map (app, source, arch) -> filename
          for apk in *.apk; do
            [ -e "$apk" ] || continue
            # record_build.py now detects arch from filename automatically
            APK_PATH="$apk" python scripts/record_build.py || true
          done
          echo "Records produced:"
          ls -la build_records/ 2>/dev/null || echo "(no records)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app_name }}-${{ matrix.source }}
          path: "*.apk"

      - name: Upload Build Records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-records-${{ matrix.app_name }}-${{ matrix.source }}
          path: build_records/
          if-no-files-found: ignore

  create-single-release:
    name: Publish New Release
    needs: [check-updates, build-apps]
    runs-on: ubuntu-latest
    if: always() && needs.check-updates.outputs.has_updates == 'true'
    permissions:
      contents: write
    env:
      # true  = after publishing, delete APKs that a newer build superseded and
      #         delete old releases that become empty because of it.
      # false = keep every release and every APK forever.
      PRUNE_OLD_RELEASES: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Plan
        uses: actions/download-artifact@v4
        with:
          name: build-plan
          path: ./build-plan
        continue-on-error: true

      - name: Download All APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-apks
          pattern: apk-*

      - name: Download All Build Records
        uses: actions/download-artifact@v4
        with:
          path: ./all-records
          pattern: build-records-*
        continue-on-error: true

      - name: Check if Any APKs Were Built
        id: check-apks
        run: |
          built_count=$(find ./all-apks -name "*.apk" 2>/dev/null | wc -l)
          echo "Built APKs: $built_count"

          if [ "$built_count" -eq 0 ]; then
            echo "❌ No rebuilt APKs available"
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "✅ $built_count rebuilt APK(s) ready for release"
            echo "skip_release=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Collect All APKs
        if: steps.check-apks.outputs.skip_release == 'false'
        run: |
          mkdir -p ./release-apks
          echo "📦 Collecting rebuilt APKs..."
          find ./all-apks -name "*.apk" -exec cp -f {} ./release-apks/ \; 2>/dev/null || true

          echo "📁 APKs ready for release:"
          ls -la ./release-apks/

          final_count=$(ls -1 ./release-apks/*.apk 2>/dev/null | wc -l || echo "0")
          echo "📊 Total APKs: $final_count"

      - name: Build Final Manifest
        if: steps.check-apks.outputs.skip_release == 'false'
        run: |
          echo "🧾 Building manifest.json from build-plan + build records..."
          # The new_manifest.json (post-plan baseline) lives in the build-plan artifact
          if [ -f ./build-plan/new_manifest.json ]; then
            cp ./build-plan/new_manifest.json ./new_manifest.json
          elif [ -f manifest.json ]; then
            # Last-resort baseline: keep the previous manifest instead of
            # replacing it with an empty/incomplete one.
            cp manifest.json ./new_manifest.json
          fi
          # Flatten all per-build records into one directory
          mkdir -p build_records
          if [ -d ./all-records ]; then
            find ./all-records -name "*.json" -exec cp {} build_records/ \; 2>/dev/null || true
          fi
          python scripts/merge_manifest.py || {
            echo "⚠️ merge_manifest.py failed; preserving the planning baseline."
            if [ -f ./new_manifest.json ]; then
              cp ./new_manifest.json ./manifest.json
            fi
          }
          if [ -f manifest.json ]; then
            echo "✅ manifest.json built:"
            jq '.entries | length' manifest.json || true
            cp manifest.json ./release-apks/manifest.json
          fi

      - name: Validate GitHub Auth
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_github_auth.py

      - name: Compute Release Tag
        if: steps.check-apks.outputs.skip_release == 'false'
        id: tag
        run: |
          # Unique tag per run: every run that rebuilt something publishes a
          # NEW release instead of updating an old one in place. This is what
          # makes Obtainium (and any other GitHub-release tracker) notice it.
          TAG="v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=Morphe APKs - $(date -u +'%Y-%m-%d %H:%M') UTC" >> "$GITHUB_OUTPUT"
          echo "🏷️  Release tag: $TAG"

      - name: Generate Release Notes
        if: steps.check-apks.outputs.skip_release == 'false'
        run: |
          echo "📝 Generating release notes..."

          {
            echo "# Morphe APKs - Auto Built"
            echo ""
            echo "## 📱 Apps in this release"
            echo ""
            for apk in ./release-apks/*.apk; do
              [ -f "$apk" ] || continue
              filename=$(basename "$apk")
              patch_version=$(printf '%s\n' "$filename" | sed -nE 's/.*-patch-v(.+)-app-v.*/\1/p')
              app_version=$(printf '%s\n' "$filename" | sed -nE 's/.*-app-v(.+)\.apk$/\1/p')
              if [ -n "$patch_version" ]; then
                echo "- $filename — Patches v$patch_version, App v$app_version"
              else
                echo "- $filename"
              fi
            done
            echo ""
            echo "> Only apps that were rebuilt in this run are attached here."
            echo "> The latest build of every other app stays in the earlier release it was built in."
            echo ""
            echo "---"
            echo ""
            echo "## ⚙️ Build Information"
            echo "- **Checked daily at 6:17 AM UTC**; a new release is published only when a new patches version (or app version) is found"
            echo "- **arm64-v8a builds only**"
            echo ""
            echo "## ⚠️ Disclaimer"
            echo "These APKs are built automatically. Use at your own risk."
          } > release_notes.md

          cat release_notes.md

      - name: Publish New Release
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="${{ steps.tag.outputs.title }}"

          mapfile -t APKS < <(find ./release-apks -maxdepth 1 -type f -name "*.apk" | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "❌ No APKs found to release"
            exit 1
          fi

          ASSETS=( "${APKS[@]}" )
          if [ -f ./release-apks/manifest.json ]; then
            ASSETS+=( ./release-apks/manifest.json )
          fi

          echo "🚀 Publishing ${#APKS[@]} rebuilt APK(s) as release $TAG..."

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Only happens when a failed run is re-run: the tag is already taken
            # by the partial release of the previous attempt, so finish it.
            echo "♻️ Release $TAG already exists; uploading assets into it"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md --latest
          else
            # --latest matters: the next run reads manifest.json from the release
            # GitHub flags as "latest", so the newest build must carry that flag.
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi

          echo "🔎 Verifying every rebuilt APK is attached to the release..."
          gh release view "$TAG" --json assets --jq '.assets[].name' > published_assets.txt

          missing=0
          for asset in "${APKS[@]}"; do
            filename=$(basename "$asset")
            if grep -Fxq "$filename" published_assets.txt; then
              echo "✅ Published: $filename"
              continue
            fi
            echo "⚠️ Missing after upload: $filename — retrying"
            gh release upload "$TAG" "$asset" --clobber
            gh release view "$TAG" --json assets --jq '.assets[].name' > published_assets.txt
            if grep -Fxq "$filename" published_assets.txt; then
              echo "✅ Recovered: $filename"
            else
              echo "❌ Still missing after retry: $filename"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "❌ One or more rebuilt APKs could not be verified in release $TAG."
            exit 1
          fi

          echo "✅ All rebuilt APKs are confirmed in release $TAG."

      - name: Prune Superseded APKs and Empty Releases
        if: steps.check-apks.outputs.skip_release == 'false' && env.PRUNE_OLD_RELEASES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Runs only after the new release was published and verified.
          # Non-fatal: a prune problem must never fail a successful build.
          python scripts/prune_releases.py --protect-tag "${{ steps.tag.outputs.tag }}" \
            || echo "⚠️ prune_releases.py failed; old releases left untouched"

      - name: Display Release URL
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "🔗 Release URL: $(gh release view "$TAG" --json url --jq .url)"
          echo ""
          echo "📦 Direct Download Links:"
          for apk in ./release-apks/*.apk; do
            filename=$(basename "$apk")
            echo "- $filename: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${filename}"
          done

  cleanup:
    name: Cleanup Workflow Runs
    needs: [build-apps, create-single-release]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 5
