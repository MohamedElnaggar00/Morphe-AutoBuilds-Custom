name: Test Google Play Version Selection

on:
  push:
    paths:
      - "src/gplaydl.py"
      - "src/utils.py"
      - "tests/test_gplaydl_version_codes.py"
      - ".github/workflows/test-gplaydl-versioncode.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "src/gplaydl.py"
      - "src/utils.py"
      - "tests/test_gplaydl_version_codes.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-version-selection:
    name: Regression tests for ABI/versionCode selection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_gplaydl_version_codes.py" -v
