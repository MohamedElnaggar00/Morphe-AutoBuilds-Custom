name: Auto Build and Release Morphe

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "Rebuild every app (ignore incremental check)"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 6 * * *'  # Daily at 6:17 AM UTC

jobs:
  download-tools:
    name: Download Morphe Tools
    runs-on: ubuntu-latest
    if: ${{ false }}
    outputs:
      cache-key: ${{ steps.cache-key.outputs.cache-key }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      
      - name: Download Morphe Tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools
          curl -L "https://github.com/revanced/revanced-cli/releases/latest/download/revanced-cli-all.jar" -o tools/revanced-cli.jar
          curl -L "https://github.com/revanced/revanced-patches/releases/latest/download/patches.jar" -o tools/patches.jar
          curl -L "https://github.com/revanced/revanced-integrations/releases/latest/download/app-release-unsigned.apk" -o tools/integrations.apk
      
      - name: Cache Tools
        uses: actions/cache@v4
        id: cache-tools
        with:
          path: tools/
          key: revanced-tools-${{ hashFiles('patch-config.json', 'arch-config.json') }}
      
      - name: Generate Cache Key
        id: cache-key
        run: echo "cache-key=${{ steps.cache-tools.outputs.cache-key || 'no-cache' }}" >> $GITHUB_OUTPUT

  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      build_matrix: ${{ steps.check.outputs.build_matrix }}
      update_count: ${{ steps.check.outputs.update_count }}
      total_count: ${{ steps.check.outputs.total_count }}
      carry_count: ${{ steps.check.outputs.carry_count }}
      incremental: ${{ steps.check.outputs.incremental }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate GitHub Auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_github_auth.py

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Run Incremental Update Check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild || 'false' }}
        run: |
          python scripts/check_app_updates.py

      - name: Show Plan Summary
        run: |
          echo "Total entries:   ${{ steps.check.outputs.total_count }}"
          echo "Need rebuild:    ${{ steps.check.outputs.update_count }}"
          echo "Carry over:      ${{ steps.check.outputs.carry_count }}"
          echo "Incremental:     ${{ steps.check.outputs.incremental }}"

      - name: Upload Plan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: |
            build_matrix.json
            carry_over.json
            new_manifest.json
          if-no-files-found: warn
          retention-days: 1

  patch-apps:
    name: Read Configuration
    needs: check-updates
    runs-on: ubuntu-latest
    if: needs.check-updates.outputs.has_updates == 'true'
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Build Matrix from Check
        id: read-matrix
        run: |
          MATRIX='${{ needs.check-updates.outputs.build_matrix }}'
          if [ -z "$MATRIX" ] || [ "$MATRIX" = "null" ]; then
            echo "Empty matrix from check; falling back to full patch-config.json"
            MATRIX=$(jq -c '.patch_list' patch-config.json)
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX" | head -c 1000

  update-readme:
    name: Update README
    needs: check-updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Refresh README from patch sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_readme.py

      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh README app and patch list"
          git push

  build-apps:
    name: Build Applications
    needs: patch-apps
    runs-on: ubuntu-latest
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        env:
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        options: --shm-size=1gb
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.patch-apps.outputs.matrix) }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Cached Tools
        uses: actions/cache@v4
        with:
          path: tools/
          key: revanced-tools-${{ hashFiles('patch-config.json', 'arch-config.json') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Signing Keystore
        env:
          MORPHE_KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
          MORPHE_KEY_PASSWORD: Morphe
        run: |
          set -euo pipefail

          if [ -z "${MORPHE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing GitHub Actions secret MORPHE_KEYSTORE_BASE64"
            echo "Add the base64-encoded BKS keystore in Settings > Secrets and variables > Actions."
            exit 1
          fi

          # The supplied signing key is BKS. The original Morphe-AutoBuilds
          # workflow signs with a JKS file, so convert the same key material
          # to JKS at runtime instead of committing the private key.
          sudo apt-get update
          sudo apt-get install -y libbcprov-java

          SOURCE_KEYSTORE="${RUNNER_TEMP}/morphe-signing.bks"
          SIGNING_KEYSTORE_PATH="${RUNNER_TEMP}/morphe-signing.jks"

          printf "%s" "${MORPHE_KEYSTORE_BASE64}" | base64 --decode > "${SOURCE_KEYSTORE}"
          chmod 600 "${SOURCE_KEYSTORE}"

          if [ ! -s "${SOURCE_KEYSTORE}" ]; then
            echo "::error::Decoded signing keystore is empty."
            exit 1
          fi

          keytool -importkeystore \
            -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider \
            -providerpath /usr/share/java/bcprov.jar \
            -srckeystore "${SOURCE_KEYSTORE}" \
            -srcstoretype BKS \
            -srcstorepass "" \
            -srckeypass "${MORPHE_KEY_PASSWORD}" \
            -srcalias Morphe \
            -destkeystore "${SIGNING_KEYSTORE_PATH}" \
            -deststoretype JKS \
            -deststorepass public \
            -destkeypass public \
            -destalias public \
            -noprompt

          chmod 600 "${SIGNING_KEYSTORE_PATH}"
          rm -f "${SOURCE_KEYSTORE}"

          if [ ! -s "${SIGNING_KEYSTORE_PATH}" ]; then
            echo "::error::JKS signing keystore conversion failed."
            exit 1
          fi

      - name: Build APK
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          TRAWL_URL: http://localhost:8191
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/morphe-signing.jks
          SIGNING_KEYSTORE_TYPE: JKS
          SIGNING_KEY_ALIAS: public
          SIGNING_KEYSTORE_PASSWORD: public
          SIGNING_KEY_PASSWORD: public
        run: |
          echo "Building ${{ matrix.app_name }} with ${{ matrix.source }}..."
          sleep $((RANDOM % 30)).$((RANDOM % 100))

          python -m src

          # An APK that is already present in the latest release is a normal skip,
          # not a failed build. Only a real build with no output should fail.
          apk_count=$(find . -maxdepth 1 -type f -name "*.apk" | wc -l)
          echo "Produced APKs: $apk_count"
          if [ "$apk_count" -eq 0 ]; then
            if [ -f .build-skipped ]; then
              echo "⏭️ Build skipped: APK is already published in the latest release."
              exit 0
            fi
            echo "::error::Build completed without producing an APK."
            exit 1
          fi

      - name: Cleanup Signing Keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/morphe-signing.bks" "${RUNNER_TEMP}/morphe-signing.jks"

      - name: Record Build Outputs
        if: always()
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p build_records
          # Record every produced APK so manifest can map (app, source, arch) -> filename
          for apk in *.apk; do
            [ -e "$apk" ] || continue
            # record_build.py now detects arch from filename automatically
            APK_PATH="$apk" python scripts/record_build.py || true
          done
          echo "Records produced:"
          ls -la build_records/ 2>/dev/null || echo "(no records)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app_name }}-${{ matrix.source }}
          path: "*.apk"

      - name: Upload Build Records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-records-${{ matrix.app_name }}-${{ matrix.source }}
          path: build_records/
          if-no-files-found: ignore

  create-single-release:
    name: Create Single Release
    needs: [check-updates, build-apps]
    runs-on: ubuntu-latest
    if: always() && needs.check-updates.outputs.has_updates == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Plan
        uses: actions/download-artifact@v4
        with:
          name: build-plan
          path: ./build-plan
        continue-on-error: true

      - name: Download All APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-apks
          pattern: apk-*

      - name: Download All Build Records
        uses: actions/download-artifact@v4
        with:
          path: ./all-records
          pattern: build-records-*
        continue-on-error: true

      - name: Check if Any APKs Were Built
        id: check-apks
        run: |
          built_count=$(find ./all-apks -name "*.apk" 2>/dev/null | wc -l)
          echo "Built APKs: $built_count"

          if [ "$built_count" -eq 0 ]; then
            echo "❌ No rebuilt APKs available"
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "✅ $built_count rebuilt APK(s) ready for release"
            echo "skip_release=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Collect All APKs
        if: steps.check-apks.outputs.skip_release == 'false'
        run: |
          mkdir -p ./release-apks
          echo "📦 Collecting rebuilt APKs..."
          find ./all-apks -name "*.apk" -exec cp -f {} ./release-apks/ \; 2>/dev/null || true

          echo "📁 APKs ready for release:"
          ls -la ./release-apks/

          final_count=$(ls -1 ./release-apks/*.apk 2>/dev/null | wc -l || echo "0")
          echo "📊 Total APKs: $final_count"

      - name: Build Final Manifest
        if: steps.check-apks.outputs.skip_release == 'false'
        run: |
          echo "🧾 Building manifest.json from build-plan + build records..."
          # The new_manifest.json (post-plan baseline) lives in the build-plan artifact
          if [ -f ./build-plan/new_manifest.json ]; then
            cp ./build-plan/new_manifest.json ./new_manifest.json
          elif [ -f manifest.json ]; then
            # Last-resort baseline: keep the previous manifest instead of
            # replacing it with an empty/incomplete one.
            cp manifest.json ./new_manifest.json
          fi
          # Flatten all per-build records into one directory
          mkdir -p build_records
          if [ -d ./all-records ]; then
            find ./all-records -name "*.json" -exec cp {} build_records/ \; 2>/dev/null || true
          fi
          python scripts/merge_manifest.py || {
            echo "⚠️ merge_manifest.py failed; preserving the planning baseline."
            if [ -f ./new_manifest.json ]; then
              cp ./new_manifest.json ./manifest.json
            fi
          }
          if [ -f manifest.json ]; then
            echo "✅ manifest.json built:"
            jq '.entries | length' manifest.json || true
            cp manifest.json ./release-apks/manifest.json
          fi

      - name: Validate GitHub Auth
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_github_auth.py

      - name: Check Existing Release
        if: steps.check-apks.outputs.skip_release == 'false'
        id: check-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release 'latest' exists; assets will be updated in place."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "📭 Release 'latest' does not exist; it will be created."
          fi
      
      - name: Generate Release Notes
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📝 Generating release notes..."

          if [ "${{ steps.check-release.outputs.release_exists }}" = "true" ]; then
            gh release view latest --json assets --jq '.assets[].name' > current_assets.txt
          else
            : > current_assets.txt
          fi

          for apk in ./release-apks/*.apk; do
            [ -f "$apk" ] || continue
            basename "$apk" >> current_assets.txt
          done

          if [ -f ./release-apks/manifest.json ]; then
            echo "manifest.json" >> current_assets.txt
          fi

          sort -u current_assets.txt > release_assets.txt

          cat > release_notes.md << 'EOF'
          # Morphe APKs - Auto Built
          
          ## 📱 Available Apps
          
          EOF

          while read -r filename; do
            [ -n "$filename" ] || continue
            echo "- $filename" >> release_notes.md
          done < release_assets.txt

          cat >> release_notes.md << 'EOF'
          ---
          
          ## ⚙️ Build Information
          - **Auto-built daily at 6:17 AM UTC**
          - **arm64-v8a builds only**
          - **Latest Morphe patches**
          - **Updated automatically**
          
          ## ⚠️ Disclaimer
          These APKs are built automatically. Use at your own risk.
          
          ## 🔄 Update Schedule
          - Automatic updates daily at 6:17 AM UTC
          - Manual updates available via workflow dispatch
          - Creates `latest` if missing and uploads rebuilt assets in place
          EOF

      - name: Upload Or Create Release
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          apk_count=$(find ./release-apks -maxdepth 1 -type f -name "*.apk" | wc -l)
          if [ "$apk_count" -eq 0 ]; then
            echo "❌ No APKs found to release"
            exit 1
          fi

          echo "🚀 Publishing $apk_count rebuilt APK(s)..."

          if [ "${{ steps.check-release.outputs.release_exists }}" = "true" ]; then
            echo "⬆️ Release 'latest' exists; uploading assets individually..."
            # Upload each asset separately so one problematic/missing asset cannot
            # prevent the other rebuilt APKs from reaching the release.
            for asset in ./release-apks/*.apk; do
              echo "  → $(basename "$asset")"
              gh release upload latest "$asset" --clobber
            done

            if [ -f ./release-apks/manifest.json ]; then
              echo "  → manifest.json"
              gh release upload latest ./release-apks/manifest.json --clobber
            fi
          else
            echo "🆕 Creating 'latest' release..."
            ASSETS=( ./release-apks/*.apk )
            if [ -f ./release-apks/manifest.json ]; then
              ASSETS+=( ./release-apks/manifest.json )
            fi

            gh release create "latest" \
              --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
              --notes-file release_notes.md \
              "${ASSETS[@]}" \
              --latest
          fi

          echo "🔎 Verifying every rebuilt APK is actually attached to the release..."
          gh release view latest --json assets --jq '.assets[].name' > published_assets.txt

          missing=0
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            filename=$(basename "$asset")
            if ! grep -Fxq "$filename" published_assets.txt; then
              echo "⚠️ Missing from release after upload: $filename"
              echo "🔁 Retrying upload for $filename..."
              gh release upload latest "$asset" --clobber
              if ! grep -Fxq "$filename" <(gh release view latest --json assets --jq '.assets[].name'); then
                echo "❌ Asset is still missing after retry: $filename"
                missing=1
              else
                echo "✅ Recovered: $filename"
              fi
            else
              echo "✅ Published: $filename"
            fi
          done < <(find ./release-apks -maxdepth 1 -type f -name "*.apk" | sort)

          if [ "$missing" -ne 0 ]; then
            echo "❌ One or more rebuilt APKs could not be verified in the release."
            exit 1
          fi

          echo "✅ All rebuilt APKs are confirmed in release 'latest'."

      - name: Prune Superseded APK Assets
        if: steps.check-apks.outputs.skip_release == 'false' && steps.check-release.outputs.release_exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          : > new_apks.txt
          find ./all-apks -type f -name "*.apk" -exec basename {} \; | sort -u > new_apks.txt

          gh release view latest --json assets --jq \
            '.assets[] | select(.name | endswith(".apk")) | .name' \
            > existing_apks.txt

          # Protect every existing APK whose app/arch identity was NOT rebuilt.
          # Older versions are deleted only after the replacement upload succeeded.
          python - <<'PY'
          from pathlib import Path
          from scripts.cleanup_old_apks import identity_prefix

          new_names = {x.strip() for x in Path("new_apks.txt").read_text().splitlines() if x.strip()}
          existing_names = {x.strip() for x in Path("existing_apks.txt").read_text().splitlines() if x.strip()}
          # Keep only the newest version when multiple builds of the same app/source/arch are produced.
          from scripts.cleanup_old_apks import version_key
          newest = {}
          for x in new_names:
              key = identity_prefix(x)
              if key not in newest or version_key(x) > version_key(newest[key]):
                  newest[key] = x
          new_names = set(newest.values())
          new_prefixes = set(newest)
          keep = set(new_names)
          keep.update(x for x in existing_names if identity_prefix(x) not in new_prefixes)

          Path("keep_apks.txt").write_text(
              "\n".join(sorted(keep)) + ("\n" if keep else ""),
              encoding="utf-8",
          )
          print(f"new/rebuilt: {len(new_names)}")
          print(f"protected non-rebuilt existing APKs: {len(keep - new_names)}")
          print(f"cleanup keep-set: {len(keep)}")
          PY

          python scripts/cleanup_old_apks.py --release latest --keep-file keep_apks.txt

      - name: Refresh Release Metadata
        if: steps.check-apks.outputs.skip_release == 'false' && steps.check-release.outputs.release_exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit latest \
            --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
            --notes-file release_notes.md
          echo "✅ Release metadata refreshed after successful upload and cleanup."
      
      - name: Display Release URL
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_url=$(gh release view latest --json url --jq .url)
          echo "🔗 Release URL: $release_url"
          echo ""
          echo "📦 Direct Download Links:"
          for apk in ./release-apks/*.apk; do
            filename=$(basename "$apk")
            echo "- $filename: $release_url/download/$filename"
          done

  cleanup:
    name: Cleanup Workflow Runs
    needs: [build-apps, create-single-release]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 5
