name: Update Patch List

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview patch-list updates without committing them"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  update-patch-list:
    name: Update All Patch Selections
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update patch selections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          ROOT = Path.cwd()
          PATCH_CONFIG = ROOT / "patch-config.json"
          SOURCES_DIR = ROOT / "sources"
          PATCHES_DIR = ROOT / "patches"
          STATE_FILE = ROOT / ".github" / "patch-list-state.json"

          TOKEN = os.environ.get("GITHUB_TOKEN", "")
          DRY_RUN = os.environ.get("DRY_RUN", "false").lower() == "true"

          # These patches are intentionally never selected automatically.
          AUTO_ENABLE_EXCLUSIONS = {
              "hushfeed": {"AMOLED dark theme"},
              "hushfacebook": {"AMOLED theme", "AMOLED black theme"},
          }

          def github_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "Morphe-AutoBuilds-Custom/update-patch-list",
                      **({"Authorization": f"Bearer {TOKEN}"} if TOKEN else {}),
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def load_upstream_patches(source_id):
              source_file = SOURCES_DIR / f"{source_id}.json"
              if not source_file.exists():
                  print(f"SKIP {source_id}: source configuration not found")
                  return None

              config = json.loads(source_file.read_text(encoding="utf-8"))
              entries = config if isinstance(config, list) else config.get("sources", [])

              # Use the last configured remote patch repository, excluding Morphe CLI.
              remote = None
              for entry in entries:
                  if not isinstance(entry, dict):
                      continue
                  user = entry.get("user")
                  repo = entry.get("repo")
                  if user and repo and not (user.lower() == "morpheapp" and repo.lower() == "morphe-cli"):
                      remote = (user, repo)

              if not remote:
                  print(f"SKIP {source_id}: no remote patch repository configured")
                  return None

              user, repo = remote
              api_url = f"https://api.github.com/repos/{user}/{repo}/contents/patches-list.json"

              try:
                  data = github_json(api_url)
                  if isinstance(data, dict) and data.get("content"):
                      import base64
                      raw = base64.b64decode(data["content"]).decode("utf-8")
                  else:
                      raise ValueError("patches-list.json content was not returned")
              except (urllib.error.HTTPError, urllib.error.URLError, ValueError, json.JSONDecodeError) as exc:
                  # Some repositories expose the file through raw.githubusercontent.com
                  # even when the Contents endpoint is unavailable.
                  raw_url = f"https://raw.githubusercontent.com/{user}/{repo}/HEAD/patches-list.json"
                  try:
                      request = urllib.request.Request(
                          raw_url,
                          headers={"User-Agent": "Morphe-AutoBuilds-Custom/update-patch-list"},
                      )
                      with urllib.request.urlopen(request, timeout=30) as response:
                          raw = response.read().decode("utf-8")
                  except Exception:
                      print(f"SKIP {source_id}: could not read {user}/{repo}/patches-list.json ({exc})")
                      return None

              payload = json.loads(raw)
              if isinstance(payload, dict):
                  items = payload.get("patches", [])
              else:
                  items = payload

              names = []
              defaults = {}
              for item in items:
                  if isinstance(item, str):
                      name = item.strip()
                  elif isinstance(item, dict):
                      name = str(item.get("name", "")).strip()
                      if name:
                          defaults[name] = bool(item.get("use", False))
                  else:
                      continue
                  if name and name not in names:
                      names.append(name)

              print(f"{source_id}: upstream patch list contains {len(names)} patches ({user}/{repo})")
              return names, defaults

          def parse_selection(path):
              entries = {}
              passthrough = []

              for raw_line in path.read_text(encoding="utf-8").splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#") or line.startswith("@"):
                      passthrough.append(raw_line)
                      continue
                  if line[0] in "+-" and len(line) > 1:
                      name = line[1:].strip()
                      if name:
                          entries[name] = line[0]
                      continue
                  # Keep unknown/comment-like lines instead of destroying user content.
                  passthrough.append(raw_line)

              return entries, passthrough

          def find_patch_file(source_id):
              candidates = sorted(PATCHES_DIR.glob("*.txt"))
              suffix = f"-{source_id}"
              matches = [p for p in candidates if p.stem.endswith(suffix)]
              if not matches:
                  return None
              if len(matches) > 1:
                  print(f"WARNING {source_id}: multiple patch files found; using {matches[0].name}")
              return matches[0]

          config = json.loads(PATCH_CONFIG.read_text(encoding="utf-8"))
          configured = config.get("patch_list", [])

          changed_files = []
          state_updates = {}
          skipped = 0

          old_state = {}
          if STATE_FILE.exists():
              try:
                  old_state = json.loads(STATE_FILE.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"WARNING: could not read {STATE_FILE}: {exc}")
          else:
              print("No patch-list baseline found. The first real run will create the baseline without treating existing upstream patches as new.")

          for item in configured:
              if not isinstance(item, dict):
                  continue

              source_id = str(item.get("source", "")).strip()
              if not source_id:
                  continue

              patch_file = find_patch_file(source_id)
              if patch_file is None:
                  print(f"SKIP {source_id}: no matching local patch-selection file")
                  continue

              upstream_data = load_upstream_patches(source_id)
              if upstream_data is None:
                  skipped += 1
                  continue

              upstream, upstream_defaults = upstream_data
              upstream_set = set(upstream)
              exclusions = AUTO_ENABLE_EXCLUSIONS.get(source_id, set())
              previous = set(old_state.get(source_id, {}).get("patches", []))

              # Compare upstream against the LAST SUCCESSFUL SNAPSHOT, not against
              # the local selection file. A local file may intentionally contain
              # only a small subset of the upstream patches, so "not in local"
              # does not mean "new upstream".
              if source_id not in old_state:
                  print(f"BASELINE {source_id}: {len(upstream)} current upstream patches recorded; no existing patches treated as new")
                  new_upstream = []
              else:
                  new_upstream = [
                      name for name in upstream
                      if name not in previous and name not in exclusions
                  ]

              # Patches removed upstream are informational only. Never delete a
              # user's local selection automatically.
              removed_upstream = [
                  name for name in previous
                  if name not in upstream_set and name not in exclusions
              ]

              state_updates[source_id] = {
                  "repository": old_state.get(source_id, {}).get("repository", ""),
                  "version": old_state.get(source_id, {}).get("version"),
                  "patches": upstream,
              }

              # Some sources (currently HushFacebook) are configured to mirror
              # the upstream default selection exactly. For those sources, the
              # local +/- file is regenerated from each patch's `use` value on
              # every real run, so upstream default changes are followed forever.
              if item.get("sync_all"):
                  desired = [
                      f"+{name}"
                      for name in upstream
                      if name not in exclusions
                  ]
                  desired_text = "\n".join(desired) + "\n"
                  current_text = patch_file.read_text(encoding="utf-8")
                  if current_text != desired_text:
                      print(f"ALL PATCHES SYNC — {patch_file.name}: enabling every available upstream patch")
                      if DRY_RUN:
                          print(f"  Would enable {len(desired)} patch(es)")
                      else:
                          changed_files.append((patch_file, desired_text))
                  else:
                      print(f"OK {patch_file.name}: all available upstream patches are enabled")
                  continue
              if not new_upstream:
                  print(f"OK {patch_file.name}: no newly discovered upstream patches")
                  if removed_upstream:
                      print(
                          f"  Note: {len(removed_upstream)} patch(es) disappeared upstream; "
                          "local selections were left untouched."
                      )
                  continue

              print(f"NEW UPSTREAM PATCHES — {patch_file.name}")
              for name in new_upstream:
                  print(f"  + {name}")

              if DRY_RUN:
                  continue

              # Add only patches that are genuinely new upstream and are not
              # intentionally excluded. Existing + / - choices stay untouched.
              old_text = patch_file.read_text(encoding="utf-8")
              base = old_text.rstrip()
              suffix = "\n" if base else ""
              new_text = base + suffix + "\n".join(f"+ {name}" for name in new_upstream) + "\n"

              changed_files.append((patch_file, new_text))

          # Persist the upstream snapshot only on a real run. This makes Preview
          # completely non-mutating and allows the same changes to appear again
          # until they are actually applied.
          if not DRY_RUN:
              STATE_FILE.parent.mkdir(parents=True, exist_ok=True)
              new_state = dict(old_state)
              new_state.update(state_updates)
              STATE_FILE.write_text(
                  json.dumps(new_state, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

              for patch_file, new_text in changed_files:
                  patch_file.write_text(new_text, encoding="utf-8")

          if DRY_RUN:
              print("")
              print("DRY RUN: no files were changed and no commit was created.")
              raise SystemExit(0)

          if not changed_files and not state_updates:
              print("")
              print("No patch-list changes detected. Nothing to commit.")
              raise SystemExit(0)

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True,
          )
          subprocess.run(["git", "add", "patches/*.txt", ".github/patch-list-state.json"], check=True)
          subprocess.run(
              ["git", "commit", "-m", "chore: update patch selections"],
              check=True,
          )
          subprocess.run(["git", "push"], check=True)

          print("")
          print(f"Committed patch-selection updates for {len(changed_files)} file(s).")
          PY
