permissions:
  contents: write

concurrency:
  group: morphe-config-management
  cancel-in-progress: false

jobs:
  manage:
    name: Apply Configuration Change
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Change and Synchronize
        env:
          CONFIG_OPERATION: ${{ inputs.operation }}
          CONFIG_APP_NAME: ${{ inputs.app_name }}
          CONFIG_NEW_APP_NAME: ${{ inputs.new_app_name }}
          CONFIG_DISPLAY_NAME: ${{ inputs.display_name }}
          CONFIG_PACKAGE_NAME: ${{ inputs.package_name }}
          CONFIG_PROVIDER: ${{ inputs.provider }}
          CONFIG_PROVIDER_REF: ${{ inputs.provider_ref }}
          CONFIG_PROVIDER_TYPE: ${{ inputs.provider_type }}
          CONFIG_DPI: ${{ inputs.dpi }}
          CONFIG_ARCHITECTURE: ${{ inputs.architecture }}
          CONFIG_PATCH_SOURCE_URL: ${{ inputs.patch_source_url }}
          CONFIG_SOURCE: ${{ inputs.source }}
          CONFIG_PATCH_ACTION: ${{ inputs.patch_action }}
          CONFIG_PATCH: ${{ inputs.patch }}
          CONFIG_STATUS: ${{ inputs.status }}
          CONFIG_CONFIRM_DELETE: ${{ inputs.confirm_delete }}
        run: |
          set -euo pipefail
          args=(
            --operation "$CONFIG_OPERATION"
            --app-name "$CONFIG_APP_NAME"
            --new-app-name "$CONFIG_NEW_APP_NAME"
            --display-name "$CONFIG_DISPLAY_NAME"
            --package-name "$CONFIG_PACKAGE_NAME"
            --provider "$CONFIG_PROVIDER"
            --provider-ref "$CONFIG_PROVIDER_REF"
            --provider-type "$CONFIG_PROVIDER_TYPE"
            --dpi "$CONFIG_DPI"
            --architecture "$CONFIG_ARCHITECTURE"
            --patch-source-url "$CONFIG_PATCH_SOURCE_URL"
            --source "$CONFIG_SOURCE"
            --patch-action "$CONFIG_PATCH_ACTION"
            --patch "$CONFIG_PATCH"
            --status "$CONFIG_STATUS"
          )
          if [ "$CONFIG_CONFIRM_DELETE" = "true" ]; then args+=(--confirm-delete); fi
          python scripts/manage_config.py "${args[@]}"

      - name: Show Configuration Changes
        run: |
          git status --short
          git diff -- config/morphe-config.json patch-config.json arch-config.json apps sources patches .github/workflows/manage-config.yml

      - name: Validate Generated Files
        run: |
          python -m py_compile scripts/manage_config.py scripts/sync_config.py
          python scripts/sync_config.py
          git diff --check

      - name: Commit and Push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- config/morphe-config.json patch-config.json arch-config.json apps sources patches .github/workflows/manage-config.yml; then
            echo "No configuration changes were necessary."
            exit 0
          fi
          git add config/morphe-config.json patch-config.json arch-config.json apps sources patches .github/workflows/manage-config.yml
          git commit -m "chore: manage repository configuration"
          git push origin "HEAD:$GITHUB_REF_NAME"
