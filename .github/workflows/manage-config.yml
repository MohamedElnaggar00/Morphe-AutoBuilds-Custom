          - "hoodles"
          - "hoomans"
          - "hushfacebook"
          - "hushfeed"
          - "hushmessenger"
          - "hxreborn"
          - "jasonwu1994"
          - "metra"
          - "morphe"
          - "piko-newx"
          - "rushi-excel"
          # END GENERATED SOURCE OPTIONS
        default: morphe

      patch_action:
        description: "Patch edit: add = force enable, exclude = exception/disable, reset = return to Morphe default"
        required: false
        type: choice
        options:
          - add
          - exclude
          - reset
        default: add

